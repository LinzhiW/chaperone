<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Company · Wireframes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="wf-styles.css">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #ece8df; font-family: "Inter", sans-serif; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="wf-shared.jsx"></script>
<script type="text/babel" src="wf-current.jsx"></script>
<script type="text/babel" src="wf-onboarding.jsx"></script>
<script type="text/babel" src="wf-pm.jsx"></script>
<script type="text/babel" src="wf-mission.jsx"></script>
<script type="text/babel" src="wf-phase2.jsx"></script>

<script type="text/babel">
const AB_W = 1280;
const AB_H = 800;

function App() {
  return (
    <DesignCanvas>
      <DCSection id="current" title="Current state" subtitle="Today's CEO Chat dashboard — baseline for the proposals below">
        <DCArtboard id="current-dashboard" label="0 · CEO Chat dashboard (today)" width={AB_W} height={AB_H}>
          <CurrentDashboard />
        </DCArtboard>
      </DCSection>
      <DCSection id="onboarding" title="Onboarding · before Phase 1" subtitle="Welcome → PM scans workspace → ready for first mission">
        <DCArtboard id="onb-welcome" label="0a · Welcome (no project)" width={AB_W} height={AB_H}>
          <Onboarding_Welcome />
        </DCArtboard>
        <DCArtboard id="onb-scan" label="0b · PM onboarding scan" width={AB_W} height={AB_H}>
          <Onboarding_PMScan />
        </DCArtboard>
        <DCArtboard id="onb-ready" label="0c · Project ready · no missions" width={AB_W} height={AB_H}>
          <Onboarding_Ready />
        </DCArtboard>
      </DCSection>
      <DCSection id="proposed" title="Proposed · Phase 1" subtitle="PM Chat → drafting Plan → Mission running → Reviewer report. PM lives in TEAM; sessions renamed Missions; PM never enters a running mission.">
        <DCArtboard id="pm-chat" label="1 · PM panel · Chat" width={AB_W} height={AB_H}>
          <PM_Chat />
        </DCArtboard>
        <DCArtboard id="pm-plan" label="2 · PM panel · drafting Mission Plan" width={AB_W} height={AB_H}>
          <PM_MissionPlan />
        </DCArtboard>
        <DCArtboard id="mission-dash" label="3 · Mission · running dashboard (no PM)" width={AB_W} height={AB_H}>
          <Mission_Dashboard />
        </DCArtboard>
        <DCArtboard id="mission-review" label="4 · Mission · Reviewer report (P1 stub)" width={AB_W} height={AB_H}>
          <Mission_Reviewer />
        </DCArtboard>
      </DCSection>
      <DCSection id="phase2-reviewer" title="Proposed · Phase 2 · Reviewer (full)" subtitle="Expanded version of artboard 4. Branch ribbon · 4-type annotation system (Bug/Note/Bloat/Missing) · cross-branch diff · decision-bar state machine.">
        <DCArtboard id="reviewer-full" label="5 · Reviewer Panel · full" width={AB_W} height={AB_H}>
          <Mission_Reviewer_Full />
        </DCArtboard>
      </DCSection>
      <DCSection id="phase2-pm-docs" title="Proposed · Phase 2 · PM Doc tabs" subtitle="Mode A for Dev log (read+edit), Mode B for PRD/SOP (structured sections + HITL diff on PM proposals). PRD shows pending edits queued after archiving the dark-mode mission.">
        <DCArtboard id="pm-devlog" label="6 · PM · Dev log.md (mode A)" width={AB_W} height={AB_H}>
          <PM_DevLog />
        </DCArtboard>
        <DCArtboard id="pm-prd" label="7 · PM · PRD.md (mode B)" width={AB_W} height={AB_H}>
          <PM_PRD />
        </DCArtboard>
        <DCArtboard id="pm-sop" label="8 · PM · SOP.md (mode B)" width={AB_W} height={AB_H}>
          <PM_SOP />
        </DCArtboard>
      </DCSection>
      <DCSection id="phase2-archive" title="Proposed · Phase 2 · Mission archive flow" subtitle="Cross-view state transition: all workers done → user clicks Archive → mission grayed in sidebar, PM dev log gets red dot, PM speaks first.">
        <DCArtboard id="mission-done" label="9 · Mission · done (pre-archive)" width={AB_W} height={AB_H}>
          <Mission_Done />
        </DCArtboard>
        <DCArtboard id="mission-archived" label="10 · Archive flow · post-archive" width={AB_W} height={AB_H}>
          <Mission_Archived />
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
